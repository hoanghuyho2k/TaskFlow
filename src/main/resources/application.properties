spring.application.name=taskflow
server.port=${PORT:8080}

# Defaults match the local-only database in compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USERNAME:taskflow}
spring.datasource.password=${DB_PASSWORD:taskflow_local}

# Hibernate checks mappings; versioned migrations will own schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method

# Verbose MVC diagnostics can include request bodies and rejected credential values.
logging.level.org.springframework.web=INFO

taskflow.jwt.secret=${JWT_SECRET}
